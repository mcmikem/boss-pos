name = "boss-pos"
main = "cloudflare-worker.js"
compatibility_date = "2026-11-07"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[define]
"process.versions.node" = "undefined"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]
