name: CI + Deploy

# Push -> green checks. Push to main -> straight to production on Vercel,
# so the in-app "Update app" button always has a newer build to fetch.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN      full-access token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      team/org id the project lives in
#   VERCEL_PROJECT_ID  the main shop project's id (fleet shops deploy
#                      separately via scripts/provision-shop.mjs)
# Without VERCEL_TOKEN the deploy job skips and checks still run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run
      - run: node --test "tests/*.test.js"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # secrets.* cannot be referenced in a job-level if: (GitHub rejects the
      # whole workflow). Gate at the step level instead, and skip cleanly.
      - name: Deploy to production
        if: env.VERCEL_TOKEN != ''
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Skip deploy (no VERCEL_TOKEN)
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set — checks ran, deploy skipped."
