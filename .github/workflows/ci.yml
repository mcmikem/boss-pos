name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build (PWA + legacy targets)
        run: npm run build

      - name: Tests
        run: npm test
        env:
          # Absent by default -> integration smoke test skips cleanly.
          # Set DATABASE_URL as a repo secret to also run DB checks.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy to Vercel (production)
    needs: build
    # Only deploy from the default branch. The actual secret gate is a
    # step-level `if` below — GitHub does not allow the `secrets` context in a
    # job-level `if` (it invalidates the whole workflow and kills every run).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "${{ secrets.VERCEL_PROJECT_ID }}" "${{ secrets.VERCEL_ORG_ID }}" > .vercel/project.json

      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
